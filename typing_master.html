<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#38bdf8" />
  <title>Typing Master - AI & Certificate Edition</title>
  
  <link rel="manifest" href="data:application/manifest+json;utf8,%7B%22name%22%3A%22Typing%20Master%20PWA%22%2C%22short_name%22%3A%22TypingMaster%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f1219%22%2C%22theme_color%22%3A%22%2338bdf8%22%7D" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-primary: #0f1219;
      --bg-secondary: #161b26;
      --bg-card: #1e2433;
      --bg-card-hover: #262e40;
      --bg-surface: #2b3347;

      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-matte: #2e374a;

      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --accent-cyan: #38bdf8;
      --accent-teal: #14b8a6;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-violet: #8b5cf6;

      --finger-pinky: #f43f5e;
      --finger-ring: #f59e0b;
      --finger-middle: #10b981;
      --finger-index: #06b6d4;
      --finger-thumb: #8b5cf6;

      --key-bg: #1e2536;
      --key-border: #2d374d;
      --key-text: #e2e8f0;
      
      --font-sans: 'Outfit', 'Inter', sans-serif;
      --font-mono: 'Fira Code', monospace;

      --shadow-matte: 0 8px 32px rgba(0, 0, 0, 0.36);
      --shadow-key: 0 4px 0 #121722;
      --shadow-key-pressed: 0 1px 0 #121722;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
    }

    [data-theme='light'] {
      --bg-primary: #f1f5f9;
      --bg-secondary: #e2e8f0;
      --bg-card: #ffffff;
      --bg-surface: #cbd5e1;
      --border-subtle: rgba(0, 0, 0, 0.08);
      --border-matte: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-dim: #94a3b8;
      --key-bg: #f8fafc;
      --key-border: #cbd5e1;
      --key-text: #1e293b;
      --shadow-key: 0 4px 0 #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      padding: 1rem;
    }

    .app-container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; min-height: 95vh; }

    .nav-header { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1.25rem; background: var(--bg-secondary); border-radius: var(--radius-lg); border: 1px solid var(--border-subtle); margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .logo-section { display: flex; align-items: center; gap: 0.75rem; }
    .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet)); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 800; color: #fff; }
    .logo-title { font-size: 1.25rem; font-weight: 800; }
    .logo-badge { font-size: 0.65rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan); border: 1px solid rgba(56, 189, 248, 0.3); text-transform: uppercase; }

    .nav-tabs { display: flex; gap: 0.35rem; background: var(--bg-primary); padding: 4px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); flex-wrap: wrap; }
    .tab-btn { padding: 0.5rem 0.9rem; border-radius: var(--radius-sm); background: transparent; color: var(--text-muted); border: none; font-family: var(--font-sans); font-weight: 600; font-size: 0.85rem; cursor: pointer; }
    .tab-btn.active { background: var(--bg-card); color: var(--accent-cyan); border: 1px solid var(--border-subtle); }

    .nav-actions { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
    .icon-btn { width: 38px; height: 38px; border-radius: var(--radius-sm); background: var(--bg-card); border: 1px solid var(--border-subtle); color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; }
    .btn-primary { display: flex; align-items: center; gap: 0.4rem; padding: 0.5rem 0.9rem; background: linear-gradient(135deg, var(--accent-cyan), #0284c7); color: #fff; border: none; border-radius: var(--radius-sm); font-family: var(--font-sans); font-weight: 600; font-size: 0.85rem; cursor: pointer; }

    .stats-banner { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.75rem; margin-bottom: 1.25rem; }
    .stat-item { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 0.85rem; text-align: center; }
    .stat-label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.2rem; }
    .stat-value { font-size: 1.6rem; font-weight: 800; font-family: var(--font-mono); color: var(--text-main); }
    .stat-value.highlight { color: var(--accent-cyan); }

    .matte-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 1.25rem; margin-bottom: 1.25rem; }
    .typing-box { background: var(--bg-secondary); border: 2px solid var(--border-matte); border-radius: var(--radius-lg); padding: 1.75rem; margin-bottom: 1.25rem; }
    .typing-text { font-family: var(--font-mono); font-size: 1.3rem; line-height: 1.8; user-select: none; white-space: pre-wrap; word-break: break-word; }

    .char.untyped { color: var(--text-dim); }
    .char.correct { color: var(--accent-emerald); background: rgba(16, 185, 129, 0.12); }
    .char.incorrect { color: var(--accent-rose); background: rgba(244, 63, 94, 0.2); text-decoration: underline; }
    .char.current { color: #fff; background: rgba(56, 189, 248, 0.35); border-bottom: 2px solid var(--accent-cyan); }

    .keyboard-container { background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 1rem; display: flex; flex-direction: column; gap: 0.35rem; max-width: 860px; margin: 0 auto 1.25rem; }
    .keyboard-row { display: flex; justify-content: center; gap: 0.3rem; }
    .key { background: var(--key-bg); border: 1px solid var(--key-border); border-radius: var(--radius-sm); color: var(--key-text); font-family: var(--font-mono); font-weight: 600; font-size: 0.85rem; height: 44px; min-width: 38px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-key); }
    .key.target { border-color: var(--accent-cyan); background: rgba(56, 189, 248, 0.25); color: #fff; }

    .key[data-finger="pinky"] { border-top: 3px solid var(--finger-pinky); }
    .key[data-finger="ring"] { border-top: 3px solid var(--finger-ring); }
    .key[data-finger="middle"] { border-top: 3px solid var(--finger-middle); }
    .key[data-finger="index"] { border-top: 3px solid var(--finger-index); }
    .key[data-finger="thumb"] { border-top: 3px solid var(--finger-thumb); }
    .key-space { flex: 6; min-width: 240px; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(10, 13, 20, 0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }
    .modal-content { background: var(--bg-secondary); border: 1px solid var(--border-matte); border-radius: var(--radius-lg); max-width: 720px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 1.75rem; }

    footer { text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-top: auto; padding-top: 1rem; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const FINGER_MAP = {
      'q':'pinky','a':'pinky','z':'pinky','1':'pinky','w':'ring','s':'ring','x':'ring','2':'ring',
      'e':'middle','d':'middle','c':'middle','3':'middle','r':'index','f':'index','v':'index','t':'index','g':'index','b':'index',
      ' ':'thumb',
      'y':'index','h':'index','n':'index','u':'index','j':'index','m':'index',
      'i':'middle','k':'middle',',':'middle','o':'ring','l':'ring','.':'ring','p':'pinky',';':'pinky'
    };

    const LESSONS = [
      { title: 'Lesson 1: Home Row - Left Hand (A S D F)', text: 'asdf asdf fdas fdas asdf asdf fads fads asdf asdf' },
      { title: 'Lesson 2: Home Row - Right Hand (J K L ;)', text: 'jkl; jkl; ;lkj ;lkj jkl; jkl; klj; klj; jkl; jkl;' },
      { title: 'Lesson 3: Complete Home Row (A S D F J K L ;)', text: 'asdf jkl; asdf jkl; fj dk sl a; gh gh asdfgh jkl;gh' }
    ];

    function playAudio(type = 'click') {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        const ctx = new AudioContextClass();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        if (type === 'correct' || type === 'click') {
          osc.type = 'triangle'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(120, now + 0.035);
          gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
        } else if (type === 'error') {
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, now); osc.frequency.exponentialRampToValueAtTime(60, now + 0.08);
          gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        }
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.08);
      } catch(e) {}
    }

    function App() {
      const [tab, setTab] = useState('academy');
      const [showCert, setShowCert] = useState(false);

      return (
        <div className="app-container">
          <header className="nav-header">
            <div className="logo-section">
              <div className="logo-icon">⌨️</div>
              <div>
                <div className="logo-title">Typing Master</div>
                <span className="logo-badge">PWA Pro</span>
              </div>
            </div>

            <div className="nav-tabs">
              <button className={`tab-btn ${tab === 'academy' ? 'active' : ''}`} onClick={() => setTab('academy')}>🎓 Academy</button>
              <button className={`tab-btn ${tab === 'aitutor' ? 'active' : ''}`} onClick={() => setTab('aitutor')}>🧠 AI Tutor</button>
              <button className={`tab-btn ${tab === 'speed' ? 'active' : ''}`} onClick={() => setTab('speed')}>⚡ Speed Test</button>
              <button className={`tab-btn ${tab === 'verify' ? 'active' : ''}`} onClick={() => setTab('verify')}>🛡️ Verify Cert</button>
            </div>

            <div className="nav-actions">
              <button className="btn-primary" onClick={() => setShowCert(true)} style={{ background: 'linear-gradient(135deg, var(--accent-amber), #d97706)' }}>📜 Certificate</button>
            </div>
          </header>

          <main style={{ flex: 1 }}>
            {tab === 'academy' && <Academy />}
            {tab === 'aitutor' && <AITutor />}
            {tab === 'speed' && <SpeedTest />}
            {tab === 'verify' && <VerifyPortal />}
          </main>

          {showCert && <CertificateModal onClose={() => setShowCert(false)} />}

          <footer>Typing Master • Unique PDF Certificate & Verification Registry</footer>
        </div>
      );
    }

    function Academy() {
      const [lessonIdx, setLessonIdx] = useState(0);
      const lesson = LESSONS[lessonIdx];
      const [inputIdx, setInputIdx] = useState(0);
      const [userInput, setUserInput] = useState('');

      useEffect(() => {
        const handleKey = (e) => {
          if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Tab'].includes(e.key)) return;
          if (e.key.length === 1) {
            playAudio(e.key === lesson.text[inputIdx] ? 'correct' : 'error');
            setInputIdx(p => p + 1);
            setUserInput(p => p + e.key);
          }
        };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [inputIdx, lessonIdx]);

      return (
        <div>
          <h2>{lesson.title}</h2>
          <div className="typing-box">
            <div className="typing-text">
              {lesson.text.split('').map((char, i) => (
                <span key={i} className={`char ${i < inputIdx ? (userInput[i] === char ? 'correct' : 'incorrect') : i === inputIdx ? 'current' : 'untyped'}`}>{char}</span>
              ))}
            </div>
          </div>
          <VirtualKeyboard targetChar={lesson.text[inputIdx] || ''} />
        </div>
      );
    }

    function AITutor() {
      const text = "pz xz pz zp xp zx pzpx xzpz pz xz pz zp xp zx pzpx xzpz";
      const [inputIdx, setInputIdx] = useState(0);
      const [userInput, setUserInput] = useState('');

      useEffect(() => {
        const handleKey = (e) => {
          if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Tab'].includes(e.key)) return;
          if (e.key.length === 1) {
            playAudio(e.key === text[inputIdx] ? 'correct' : 'error');
            setInputIdx(p => p + 1);
            setUserInput(p => p + e.key);
          }
        };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [inputIdx]);

      return (
        <div>
          <div className="matte-card" style={{ borderLeft: '4px solid var(--accent-violet)' }}>
            🧠 <strong>AI Detected Weak Keys: P, Z, X</strong> | Practice targeted drill below!
          </div>
          <div className="typing-box">
            <div className="typing-text">
              {text.split('').map((char, i) => (
                <span key={i} className={`char ${i < inputIdx ? (userInput[i] === char ? 'correct' : 'incorrect') : i === inputIdx ? 'current' : 'untyped'}`}>{char}</span>
              ))}
            </div>
          </div>
          <VirtualKeyboard targetChar={text[inputIdx] || ''} />
        </div>
      );
    }

    function SpeedTest() {
      const text = "The quick brown fox jumps over the lazy dog. Touch typing builds fast muscle memory.";
      const [inputIdx, setInputIdx] = useState(0);
      const [userInput, setUserInput] = useState('');

      useEffect(() => {
        const handleKey = (e) => {
          if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Tab'].includes(e.key)) return;
          if (e.key.length === 1) {
            playAudio(e.key === text[inputIdx] ? 'correct' : 'error');
            setInputIdx(p => p + 1);
            setUserInput(p => p + e.key);
          }
        };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [inputIdx]);

      return (
        <div>
          <h2>Speed Sprint Test</h2>
          <div className="typing-box">
            <div className="typing-text">
              {text.split('').map((char, i) => (
                <span key={i} className={`char ${i < inputIdx ? (userInput[i] === char ? 'correct' : 'incorrect') : i === inputIdx ? 'current' : 'untyped'}`}>{char}</span>
              ))}
            </div>
          </div>
          <VirtualKeyboard targetChar={text[inputIdx] || ''} />
        </div>
      );
    }

    function VerifyPortal() {
      const [query, setQuery] = useState('');
      const [result, setResult] = useState(null);

      const handleSearch = (e) => {
        e.preventDefault();
        const raw = localStorage.getItem('typing_master_cloud_certificates');
        const certs = raw ? JSON.parse(raw) : [];
        const clean = query.trim().toLowerCase();
        const found = certs.find(c => c.certId.toLowerCase() === clean || c.email.toLowerCase() === clean || c.username.toLowerCase() === clean);
        setResult(found || 'not_found');
      };

      return (
        <div style={{ maxWidth: '700px', margin: '0 auto', textAlign: 'center' }}>
          <h2>🛡️ Cloud Certificate Retrieval & Verification</h2>
          <p style={{ color: 'var(--text-muted)', margin: '0.5rem 0 1.5rem' }}>Enter your Unique Certificate ID or Email ID to verify and re-download your PDF certificate.</p>
          <form onSubmit={handleSearch} style={{ display: 'flex', gap: '0.5rem', marginBottom: '2rem' }}>
            <input type="text" value={query} onChange={e => setQuery(e.target.value)} placeholder="Enter Certificate ID (e.g. TM-2026-8A4F1E) or Email" style={{ flex: 1, padding: '0.8rem', background: 'var(--bg-card)', border: '1px solid var(--border-matte)', borderRadius: '8px', color: '#fff' }} />
            <button className="btn-primary" type="submit">Verify Now</button>
          </form>

          {result && result !== 'not_found' && (
            <div className="matte-card" style={{ border: '2px solid var(--accent-emerald)', textAlign: 'center' }}>
              <h3 style={{ color: 'var(--accent-emerald)' }}>✅ AUTHENTIC CLOUD CERTIFICATE</h3>
              <div style={{ fontSize: '1.2rem', fontWeight: '800', margin: '0.5rem 0' }}>{result.username}</div>
              <div>Email: <strong>{result.email}</strong></div>
              <div>Certificate ID: <strong style={{ color: 'var(--accent-cyan)' }}>{result.certId}</strong></div>
              <div style={{ marginTop: '1rem' }}>
                <button className="btn-primary" onClick={() => window.print()} style={{ margin: '0 auto' }}>🖨️ Download PDF</button>
              </div>
            </div>
          )}
          {result === 'not_found' && (
            <div className="matte-card" style={{ borderLeft: '4px solid var(--accent-rose)' }}>
              ⚠️ No matching certificate found for "{query}".
            </div>
          )}
        </div>
      );
    }

    function VirtualKeyboard({ targetChar }) {
      const rows = [
        ['1','2','3','4','5','6','7','8','9','0'],
        ['q','w','e','r','t','y','u','i','o','p'],
        ['a','s','d','f','g','h','j','k','l',';'],
        ['z','x','c','v','b','n','m'],
        ['Space']
      ];
      const norm = targetChar ? targetChar.toLowerCase() : '';

      return (
        <div className="keyboard-container">
          {rows.map((r, ri) => (
            <div key={ri} className="keyboard-row">
              {r.map((k, ki) => (
                <div key={ki} className={`key ${k === 'Space' ? 'key-space' : ''} ${(k === 'Space' && norm === ' ') || norm === k ? 'target' : ''}`} data-finger={FINGER_MAP[k]}>
                  {k === 'Space' ? 'SPACEBAR' : k.toUpperCase()}
                </div>
              ))}
            </div>
          ))}
        </div>
      );
    }

    function CertificateModal({ onClose }) {
      const [username, setUsername] = useState('');
      const [email, setEmail] = useState('');
      const [certRecord, setCertRecord] = useState(null);

      const handleGenerate = (e) => {
        e.preventDefault();
        if (!username.trim() || !email.trim()) return alert('Please enter Username and Email!');
        const year = new Date().getFullYear();
        const randomHex = Math.random().toString(36).substring(2, 8).toUpperCase();
        const certId = `TM-${year}-${randomHex}`;
        const record = {
          certId,
          username: username.trim(),
          email: email.trim().toLowerCase(),
          wpm: 68,
          accuracy: 98,
          formattedDate: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
        };
        const raw = localStorage.getItem('typing_master_cloud_certificates');
        const certs = raw ? JSON.parse(raw) : [];
        certs.unshift(record);
        localStorage.setItem('typing_master_cloud_certificates', JSON.stringify(certs));
        setCertRecord(record);
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-content" onClick={e => e.stopPropagation()} style={{ textAlign: 'center' }}>
            {!certRecord ? (
              <div>
                <h3>📜 Download Certificate PDF</h3>
                <p style={{ color: 'var(--text-muted)', margin: '0.5rem 0 1.25rem' }}>Enter your Username and Email ID below to stamp your unique data onto your PDF certificate.</p>
                <form onSubmit={handleGenerate} style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem', maxWidth: '400px', margin: '0 auto' }}>
                  <input type="text" placeholder="Username / Name" value={username} onChange={e => setUsername(e.target.value)} style={{ padding: '0.8rem', background: 'var(--bg-card)', border: '1px solid var(--border-matte)', borderRadius: '6px', color: '#fff' }} required />
                  <input type="email" placeholder="Email Address" value={email} onChange={e => setEmail(e.target.value)} style={{ padding: '0.8rem', background: 'var(--bg-card)', border: '1px solid var(--border-matte)', borderRadius: '6px', color: '#fff' }} required />
                  <button className="btn-primary" type="submit" style={{ justifyContent: 'center', padding: '0.8rem' }}>✨ Generate & Download PDF</button>
                </form>
              </div>
            ) : (
              <div>
                <div style={{ border: '4px double var(--accent-amber)', padding: '2rem', borderRadius: '12px' }}>
                  <h3>👑 CERTIFICATE OF PROFICIENCY</h3>
                  <div style={{ color: 'var(--accent-cyan)', fontWeight: 'bold', margin: '0.5rem 0' }}>UNIQUE ID: {certRecord.certId}</div>
                  <h2>{certRecord.username}</h2>
                  <div>Registered Email: <strong>{certRecord.email}</strong></div>
                  <div style={{ margin: '1rem 0' }}>Speed: <strong>68 WPM</strong> | Accuracy: <strong>98%</strong></div>
                  <div>Issued Date: {certRecord.formattedDate}</div>
                </div>
                <button className="btn-primary" onClick={() => window.print()} style={{ margin: '1.25rem auto 0' }}>🖨️ Download PDF</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

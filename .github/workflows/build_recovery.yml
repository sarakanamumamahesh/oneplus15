name: Universal Android Recovery Builder (TWRP / OrangeFox / SHRP / PBRP)

on:
  workflow_dispatch:
    inputs:
      RECOVERY_TYPE:
        description: 'Select Recovery Framework'
        required: true
        type: choice
        default: 'TWRP'
        options:
          - 'TWRP'
          - 'OrangeFox'
          - 'SHRP'
          - 'PBRP'
          - 'Custom'
      MAKEFILE_PREFIX:
        description: 'Product Makefile Prefix (twrp / fox / shrp / pbrp)'
        required: true
        type: choice
        default: 'twrp'
        options:
          - 'twrp'
          - 'fox'
          - 'shrp'
          - 'pbrp'
      MANIFEST_URL:
        description: 'Manifest Repository URL (If Custom or Override)'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git'
      MANIFEST_BRANCH:
        description: 'Manifest Branch'
        required: true
        default: 'twrp-14.1'
      BUILD_TARGET:
        description: 'Target Build Image'
        required: true
        type: choice
        default: 'vendor_bootimage'
        options:
          - 'vendor_bootimage'
          - 'bootimage'
          - 'recoveryimage'
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'oneplus15'

jobs:
  build:
    name: Build Universal Recovery
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free Up Runner Disk Space
        run: |
          echo "=== Disk Space Before Cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf "/usr/local/share/boost"
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo apt-get clean
          echo "=== Disk Space After Cleanup ==="
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf lib32ncurses5-dev lib32z1-dev \
            liblz4-tool libncurses5 libncurses5-dev libreadline-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python3-pip

      - name: Install Repo Tool
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Configure Git Credentials
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global --unset-all http.https://github.com/.extraheader || true
          git config --global url."https://github.com/".insteadOf "git@github.com:" || true

      - name: Resolve Manifest URL & Branch
        id: manifest
        run: |
          RECOVERY_TYPE="${{ github.event.inputs.RECOVERY_TYPE }}"
          URL="${{ github.event.inputs.MANIFEST_URL }}"
          BRANCH="${{ github.event.inputs.MANIFEST_BRANCH }}"

          if [ "$RECOVERY_TYPE" = "TWRP" ]; then
            URL="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
            BRANCH="twrp-14.1"
          elif [ "$RECOVERY_TYPE" = "OrangeFox" ]; then
            URL="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
            BRANCH="twrp-14.1"
          elif [ "$RECOVERY_TYPE" = "SHRP" ]; then
            URL="https://github.com/SHRP/manifest.git"
            BRANCH="shrp-12.1"
          elif [ "$RECOVERY_TYPE" = "PBRP" ]; then
            URL="https://github.com/PitchBlackRecoveryProject/manifest.git"
            BRANCH="android-12.1"
          fi

          echo "final_url=$URL" >> $GITHUB_OUTPUT
          echo "final_branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Using Manifest URL: $URL"
          echo "Using Manifest Branch: $BRANCH"

      - name: Initialize Recovery Source Manifest
        run: |
          mkdir -p ~/recovery
          cd ~/recovery
          repo init -u ${{ steps.manifest.outputs.final_url }} -b ${{ steps.manifest.outputs.final_branch }} --depth=1 --no-repo-verify
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Move Device Tree into Source Tree
        run: |
          DEVICE_NAME="${{ github.event.inputs.DEVICE_NAME }}"
          mkdir -p ~/recovery/device/oneplus/$DEVICE_NAME
          cp -r device/oneplus/$DEVICE_NAME/* ~/recovery/device/oneplus/$DEVICE_NAME/

      - name: Build Recovery Image
        run: |
          cd ~/recovery
          source build/envsetup.sh
          
          PREFIX="${{ github.event.inputs.MAKEFILE_PREFIX }}"
          DEVICE="${{ github.event.inputs.DEVICE_NAME }}"
          TARGET="${{ github.event.inputs.BUILD_TARGET }}"
          
          echo "Executing: lunch ${PREFIX}_${DEVICE}-userdebug"
          lunch ${PREFIX}_${DEVICE}-userdebug || lunch twrp_${DEVICE}-userdebug || lunch fox_${DEVICE}-userdebug
          
          echo "Executing: mka $TARGET -j$(nproc --all)"
          mka $TARGET -j$(nproc --all)

      - name: Package Recovery Output
        run: |
          DEVICE="${{ github.event.inputs.DEVICE_NAME }}"
          cd ~/recovery/out/target/product/$DEVICE
          zip -r ~/${{ github.event.inputs.RECOVERY_TYPE }}-Recovery-$DEVICE-unofficial.zip *.img || true

      - name: Upload Recovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.RECOVERY_TYPE }}-${{ github.event.inputs.DEVICE_NAME }}-Recovery
          path: |
            ~/recovery/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/vendor_boot.img
            ~/recovery/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
            ~/*.zip

      - name: Release Recovery Image
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v1.0-${{ github.event.inputs.RECOVERY_TYPE }}-${{ github.run_id }}"
          name: "${{ github.event.inputs.RECOVERY_TYPE }} Recovery for ${{ github.event.inputs.DEVICE_NAME }} (Build #${{ github.run_number }})"
          body: |
            ## ${{ github.event.inputs.RECOVERY_TYPE }} Recovery Build
            - **Target Device**: ${{ github.event.inputs.DEVICE_NAME }}
            - **Recovery Type**: ${{ github.event.inputs.RECOVERY_TYPE }}
            - **Target Image**: `${{ github.event.inputs.BUILD_TARGET }}`
            - **Build Date**: ${{ github.event.head_commit.timestamp || 'Manual Build' }}
          files: |
            ~/recovery/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/vendor_boot.img
            ~/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

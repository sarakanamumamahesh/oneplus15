name: Build OrangeFox Recovery for OnePlus 15

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: 'fox_12.1'
      BUILD_TARGET:
        description: 'Build Target Image (vendor_bootimage or recoveryimage)'
        required: true
        default: 'vendor_bootimage'

jobs:
  build:
    name: Build OrangeFox Recovery
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device/oneplus/oneplus15

      - name: Free Up Runner Disk Space
        run: |
          echo "=== Disk Space Before Cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf "/usr/local/share/boost"
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo apt-get clean
          echo "=== Disk Space After Cleanup ==="
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf lib32ncurses5-dev lib32z1-dev \
            liblz4-tool libncurses5 libncurses5-dev libreadline-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python3-pip

      - name: Install Repo Tool
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Initialize OrangeFox Source Manifest
        run: |
          mkdir -p ~/orangefox
          cd ~/orangefox
          repo init -u https://gitlab.com/OrangeFox/Manifest.git -b ${{ github.event.inputs.MANIFEST_BRANCH }} --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Move Device Tree into Source Tree
        run: |
          mkdir -p ~/orangefox/device/oneplus/oneplus15
          cp -r device/oneplus/oneplus15/* ~/orangefox/device/oneplus/oneplus15/

      - name: Build OrangeFox Recovery
        run: |
          cd ~/orangefox
          source build/envsetup.sh
          lunch fox_oneplus15-userdebug
          mka ${{ github.event.inputs.BUILD_TARGET }} -j$(nproc --all)

      - name: Package Recovery Output
        run: |
          cd ~/orangefox/out/target/product/oneplus15
          zip -r ~/OrangeFox-oneplus15-unofficial.zip *.img || true

      - name: Upload Recovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-OnePlus15-Recovery
          path: |
            ~/orangefox/out/target/product/oneplus15/*.img
            ~/OrangeFox-oneplus15-unofficial.zip

      - name: Release Recovery Image
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v1.0-${{ github.run_id }}"
          name: "OrangeFox Recovery for OnePlus 15 (Build #${{ github.run_number }})"
          body: |
            ## OrangeFox Unofficial Recovery for OnePlus 15
            - **Target Device**: OnePlus 15 (`oneplus15`)
            - **Platform**: Snapdragon 8 Elite (`pineapple`)
            - **Android Base**: Android 15 (GKI v4)
            - **Build Date**: ${{ github.event.head_commit.timestamp || 'Manual Build' }}
          files: |
            ~/orangefox/out/target/product/oneplus15/vendor_boot.img
            ~/orangefox/out/target/product/oneplus15/boot.img
            ~/OrangeFox-oneplus15-unofficial.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

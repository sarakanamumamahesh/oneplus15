name: Build OrangeFox Recovery for OnePlus 15 (IN)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'Recovery Manifest Repository URL'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git'
      MANIFEST_BRANCH:
        description: 'Recovery Manifest Branch'
        required: true
        default: 'twrp-12.1'

jobs:
  build:
    name: Build OrangeFox Recovery
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free Up Runner Disk Space
        run: |
          echo "=== Disk Space Before Cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf "/usr/local/share/boost"
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo apt-get clean
          echo "=== Disk Space After Cleanup ==="
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf lib32ncurses5-dev lib32z1-dev \
            liblz4-tool libncurses5 libncurses5-dev libreadline-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python3-pip

      - name: Install Repo Tool
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Configure Git Credentials
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global --unset-all http.https://github.com/.extraheader || true
          git config --global url."https://github.com/".insteadOf "git@github.com:" || true

      - name: Initialize Recovery Source Manifest
        run: |
          mkdir -p ~/orangefox
          cd ~/orangefox
          repo init -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} --depth=1 --no-repo-verify
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Move Device Tree into Source Tree
        run: |
          mkdir -p ~/orangefox/device/oneplus/oneplus15
          cp -r device/oneplus/oneplus15/* ~/orangefox/device/oneplus/oneplus15/

      - name: Build OrangeFox / TWRP Recovery (vendor_bootimage)
        run: |
          cd ~/orangefox
          source build/envsetup.sh
          lunch fox_oneplus15-userdebug || lunch twrp_oneplus15-userdebug
          mka vendor_bootimage -j$(nproc --all)

      - name: Package Recovery Output
        run: |
          cd ~/orangefox/out/target/product/oneplus15
          zip -r ~/OrangeFox-oneplus15-IN-unofficial.zip *.img || true

      - name: Upload Recovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-OnePlus15-IN-Recovery
          path: |
            ~/orangefox/out/target/product/oneplus15/vendor_boot.img
            ~/orangefox/out/target/product/oneplus15/*.img
            ~/OrangeFox-oneplus15-IN-unofficial.zip

      - name: Release Recovery Image
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v1.0-IN-${{ github.run_id }}"
          name: "OrangeFox Recovery for OnePlus 15 (Indian Variant - Build #${{ github.run_number }})"
          body: |
            ## OrangeFox Recovery for OnePlus 15 (Indian Region / IN Variant)
            - **Target Device**: OnePlus 15 (`oneplus15` / IN)
            - **Platform**: Snapdragon 8 Elite (`pineapple`)
            - **Target Image**: `vendor_boot.img`
            - **Build Date**: ${{ github.event.head_commit.timestamp || 'Manual Build' }}
          files: |
            ~/orangefox/out/target/product/oneplus15/vendor_boot.img
            ~/OrangeFox-oneplus15-IN-unofficial.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
